name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Verify annotated tag and support version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
            echo "Release tags must be annotated tags." >&2
            exit 1
          fi

          mapfile -t versions < <(
            cargo metadata \
              --manifest-path support/Cargo.toml \
              --format-version 1 \
              --no-deps \
              | jq -r '.packages[].version' \
              | sort -u
          )

          if [[ "${#versions[@]}" -ne 1 ]]; then
            echo "All support workspace packages must have the same version." >&2
            printf 'Found: %s\n' "${versions[@]}" >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_NAME}" != "${versions[0]}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match support version ${versions[0]}." >&2
            exit 1
          fi

      - name: Test support workspace
        run: cargo test --manifest-path support/Cargo.toml --workspace --locked

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - runner: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build Kagura CLI
        run: >-
          cargo build
          --manifest-path support/Cargo.toml
          --package kagura-cli
          --release
          --locked
          --target ${{ matrix.target }}

      - name: Package Unix release
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          bundle="kagura-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/${bundle}"
          cp "support/target/${{ matrix.target }}/release/kagura" "dist/${bundle}/"
          cp LICENSE.md README.md "dist/${bundle}/"
          cp -R specs "dist/${bundle}/"
          tar -C dist -czf "dist/${bundle}.tar.gz" "${bundle}"

      - name: Package Windows release
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $bundle = "kagura-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          $bundlePath = Join-Path "dist" $bundle
          New-Item -ItemType Directory -Path $bundlePath | Out-Null
          Copy-Item "support/target/${{ matrix.target }}/release/kagura.exe" $bundlePath
          Copy-Item "LICENSE.md", "README.md" $bundlePath
          Copy-Item "specs" $bundlePath -Recurse
          Compress-Archive -Path $bundlePath -DestinationPath "dist/$bundle.zip"

      - name: Upload packaged release
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: dist/*.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download packaged releases
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip *.tar.gz > SHA256SUMS

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            dist/* \
            --draft \
            --verify-tag \
            --title "Kagura support ${GITHUB_REF_NAME}" \
            --notes-from-tag
